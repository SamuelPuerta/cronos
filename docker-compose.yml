# DynamoDB Local for CRONOS (optional lab bonus).
# Usage:
#   docker compose up -d                  # start DynamoDB Local on port 8000
#   python scripts/create_local_table.py  # create CapsulesTable + GSI locally
#   docker compose down                   # stop (data persists in the volume)
#   docker compose down -v                # stop AND delete the persisted data
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: cronos-dynamodb-local
    ports:
      - "8000:8000"
    # -sharedDb: single shared database file for all tables/credentials
    # -dbPath: store data inside the mounted volume so it survives restarts
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    volumes:
      - dynamodb-local-data:/home/dynamodblocal/data

volumes:
  dynamodb-local-data:
